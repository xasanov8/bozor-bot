<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>Superadmin — Bozor Top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css?v=13" />
</head>
<body>
  <div id="login-view" class="login-wrap">
    <form class="login-card" id="login-form">
      <div class="login-lang lang-switch" id="login-lang-switch">
        <button type="button" class="lang-btn active" data-lang="uz">UZ</button>
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
      </div>
      <div class="badge" data-i18n="badge">SUPERADMIN</div>
      <h1 data-i18n="login_h1">Bozor boshqaruvi</h1>
      <p class="muted" data-i18n="login_hint">Faqat localhost. Parolni kiriting.</p>
      <label data-i18n="password">Parol</label>
      <input type="password" id="login-password" data-i18n-placeholder="password_ph" placeholder="Superadmin paroli" autocomplete="current-password" required />
      <button type="submit" class="btn primary" data-i18n="login">Kirish</button>
      <p class="error" id="login-error" hidden></p>
    </form>
  </div>

  <div id="app-view" class="app hidden">
    <header class="mobile-bar" id="mobile-bar">
      <button type="button" class="menu-toggle" id="menu-toggle" data-i18n-aria="menu" aria-label="Menyu" aria-expanded="false" aria-controls="sidebar">
        <span class="menu-bars" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
      </button>
      <div class="mobile-bar-brand">
        <span class="brand-mark sm" aria-hidden="true">BT</span>
        <div>
          <div class="brand sm">Bozor Top</div>
          <div class="brand-sub" id="mobile-tab-label">Dashboard</div>
        </div>
      </div>
      <div class="lang-switch compact" id="mobile-lang-switch">
        <button type="button" class="lang-btn active" data-lang="uz">UZ</button>
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
      </div>
      <span class="pill compact">local</span>
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand-block desktop-only">
        <div class="brand-mark" aria-hidden="true">BT</div>
        <div class="brand-text">
          <div class="brand">Bozor Top</div>
          <div class="brand-sub" data-i18n="brand_sub">Superadmin</div>
        </div>
      </div>

      <div class="sidebar-drawer-head mobile-only">
        <div class="brand-block" style="padding:0;margin:0;">
          <div class="brand-mark" aria-hidden="true">BT</div>
          <div class="brand-text">
            <div class="brand">Bozor Top</div>
            <div class="brand-sub" data-i18n="menu">Menyu</div>
          </div>
        </div>
        <button type="button" class="icon-btn" id="menu-close" data-i18n-aria="close" aria-label="Yopish">✕</button>
      </div>

      <div class="nav-section">
        <div class="nav-label" data-i18n="section_main">Asosiy</div>
        <nav class="nav-list">
          <button type="button" class="nav active" data-tab="dashboard">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
            </span>
            <span class="nav-copy">
              <span class="nav-title" data-i18n="nav_dashboard">Dashboard</span>
              <span class="nav-desc" data-i18n="nav_dashboard_d">Umumiy ko‘rinish</span>
            </span>
          </button>
          <button type="button" class="nav" data-tab="report">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16V10"/><path d="M12 16V7"/><path d="M16 16v-4"/></svg>
            </span>
            <span class="nav-copy">
              <span class="nav-title" data-i18n="nav_report">Hisobot</span>
              <span class="nav-desc" data-i18n="nav_report_d">Statistika va top</span>
            </span>
          </button>
          <button type="button" class="nav" data-tab="support">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8"/><path d="M8 13h5"/></svg>
            </span>
            <span class="nav-copy">
              <span class="nav-title" data-i18n="nav_support">Yordam</span>
              <span class="nav-desc" data-i18n="nav_support_d">Support chat</span>
            </span>
            <em class="nav-badge hidden" id="support-nav-badge">0</em>
          </button>
        </nav>
      </div>

      <div class="nav-section">
        <div class="nav-label" data-i18n="section_manage">Boshqaruv</div>
        <nav class="nav-list">
          <button type="button" class="nav" data-tab="markets">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h16l-1.2 9H5.2L4 10z"/><path d="M3 10 5.5 4h13L21 10"/><path d="M10 14v3"/><path d="M14 14v3"/></svg>
            </span>
            <span class="nav-copy">
              <span class="nav-title" data-i18n="nav_markets">Bozorlar</span>
              <span class="nav-desc" data-i18n="nav_markets_d">Bozor qo‘shish</span>
            </span>
          </button>
          <button type="button" class="nav" data-tab="shops">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16v12H4z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/><path d="M9 13h6"/></svg>
            </span>
            <span class="nav-copy">
              <span class="nav-title" data-i18n="nav_shops">Do‘konlar</span>
              <span class="nav-desc" data-i18n="nav_shops_d">Bozor bo‘yicha</span>
            </span>
          </button>
          <button type="button" class="nav" data-tab="owners">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 19.5c1.2-3.2 3.7-4.8 7-4.8s5.8 1.6 7 4.8"/></svg>
            </span>
            <span class="nav-copy">
              <span class="nav-title" data-i18n="nav_owners">Do‘kon egalari</span>
              <span class="nav-desc" data-i18n="nav_owners_d">Login va parol</span>
            </span>
          </button>
        </nav>
      </div>

      <div class="sidebar-foot">
        <div class="sidebar-hint" data-i18n="localhost_only">Faqat localhost</div>
        <button type="button" class="btn ghost logout" id="logout" data-i18n="logout">Chiqish</button>
      </div>
    </aside>

    <main class="content">
      <header class="top">
        <div class="top-left">
          <p class="top-kicker" id="page-kicker">Asosiy</p>
          <h2 id="page-title">Dashboard</h2>
        </div>
        <div class="top-right">
          <div class="lang-switch desktop-only" id="top-lang-switch">
            <button type="button" class="lang-btn active" data-lang="uz">UZ</button>
            <button type="button" class="lang-btn" data-lang="ru">RU</button>
          </div>
          <span class="pill desktop-only">localhost only</span>
        </div>
      </header>
      <div id="panel"></div>
    </main>
  </div>
  <script src="/admin/i18n.js?v=2"></script>
  <script src="/admin/admin.js?v=13"></script>
</body>
</html>
