<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Bozor Top — Katta bozorlar</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=12" />
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <button type="button" class="icon-btn hidden" id="btn-back" aria-label="Orqaga">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-titles">
        <h1 class="topbar-title" id="page-title">Bozor Top</h1>
        <p class="topbar-sub" id="page-sub">Katta bozorlarda qidirish</p>
      </div>
      <button type="button" class="icon-btn hidden chat-icon-btn" id="btn-chat-top" aria-label="Chatlar" title="Chatlar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 01-4 4H8l-5 3V7a4 4 0 014-4h10a4 4 0 014 4z"/></svg>
        <em class="chat-badge hidden" id="chat-badge">0</em>
      </button>
    </header>

    <main class="main" id="main">
      <div id="view" class="view"></div>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button type="button" class="nav-item active" data-route="home" data-roles="buyer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>
        <span>Bozorlar</span>
      </button>
      <button type="button" class="nav-item" data-route="search" data-roles="buyer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Qidiruv</span>
      </button>
      <button type="button" class="nav-item" data-route="favorites" data-roles="buyer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>
        <span>Sevimli</span>
      </button>
      <button type="button" class="nav-item" data-route="cart" data-roles="buyer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg>
        <span>Savat <em class="nav-badge hidden" id="cart-badge">0</em></span>
      </button>
      <button type="button" class="nav-item" data-route="owner" data-roles="owner">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-4h16l1 4"/><path d="M4 9v11h16V9"/><path d="M9 13h6"/><path d="M12 9v8"/></svg>
        <span>Do'konim</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/js/app.js?v=12"></script>
</body>
</html>
